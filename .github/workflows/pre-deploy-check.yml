# =============================================================
# GitHub Actions — Pre-deploy quality check
# Runs on PRs targeting 'main' to catch issues before deploy
# =============================================================

name: Pre-Deploy Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ── Backend checks ──
  backend:
    name: Backend — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check for syntax errors
        run: node --check src/server.js

  # ── Frontend checks ──
  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true  # Don't block deploy on lint warnings

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://bookingsport-api.onrender.com/api
